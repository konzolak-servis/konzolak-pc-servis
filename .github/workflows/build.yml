name: Sestavení a vydání
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # vytvoření vydání (GitHub Releases)

jobs:
  build:
    runs-on: windows-latest
    env:
      # Podepisování se zapne samo, jakmile jsou v repozitáři nastavené tajné klíče
      # (Settings → Secrets and variables → Actions). Bez nich se sestaví nepodepsaný .exe.
      PODEPSAT: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verze
        id: verze
        shell: pwsh
        run: |
          [xml]$p = Get-Content src/KonzolakServis/KonzolakServis.csproj
          $hlavni = ($p.Project.PropertyGroup | Where-Object { $_.HlavniVerze } | Select-Object -First 1).HlavniVerze
          $verze = "$hlavni.${{ github.run_number }}"
          "verze=$verze" >> $env:GITHUB_OUTPUT
          "Verze: $verze"

      - run: dotnet publish src/KonzolakServis/KonzolakServis.csproj -c Release -o publish -p:CisloBuildu=${{ github.run_number }}

      - name: Pojmenovat podle verze
        shell: pwsh
        run: Rename-Item publish/KonzolakServis.exe "KonzolakServiceApp_v${{ steps.verze.outputs.verze }}.exe"

      # Podpis přes Azure Trusted Signing (Microsoft). Potřebné secrets:
      # AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      # TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE
      - name: Podepsat .exe
        if: env.PODEPSAT == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: KonzolakServiceApp_v${{ steps.verze.outputs.verze }}
          path: publish/KonzolakServiceApp_v${{ steps.verze.outputs.verze }}.exe

      # Každý build z větve main = nové vydání. Z něj si aplikace stahuje aktualizace.
      - name: Vydat verzi
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verze = "${{ steps.verze.outputs.verze }}"
          # Popis vydání = nejnovější sekce z Novinky.md
          $text = Get-Content src/KonzolakServis/Novinky.md -Raw -Encoding UTF8
          $sekce = ($text -split '(?m)^## ')[1]
          $popis = ($sekce -split "`n", 2)[1].Trim()
          Set-Content poznamky.md $popis -Encoding UTF8
          gh release create "v$verze" "publish/KonzolakServiceApp_v$verze.exe" --title "Konzolak service app $verze" --notes-file poznamky.md
