name: Sestavení .exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/KonzolakServis/KonzolakServis.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: KonzolakServis
          path: publish/KonzolakServis.exe
